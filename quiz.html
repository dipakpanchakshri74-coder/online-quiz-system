<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Quiz</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-container {
      background: white;
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    #question {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #222;
    }

    .option {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      text-align: left;
      font-size: 16px;
      transition: 0.3s;
    }

    .option:hover {
      background: #f0f0ff;
      border-color: #667eea;
    }

    .option.correct {
      background: #c8f7c5;
      border-color: green;
    }

    .option.wrong {
      background: #ffc8c8;
      border-color: red;
    }

    #nextBtn,
    #restartBtn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin-top: 15px;
    }

    #nextBtn:hover,
    #restartBtn:hover {
      background: #5568d8;
    }

    #score {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin: 20px 0;
      color: #333;
    }

    #progress {
      text-align: right;
      color: #666;
      margin-bottom: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="quiz-container">

    <h1>Online Quiz</h1>

    <div id="quizBox">

      <div id="progress"></div>

      <div id="question"></div>

      <div id="options"></div>

      <button id="nextBtn" class="hidden">Next Question</button>

    </div>

    <div id="resultBox" class="hidden">
      <h1>Quiz Completed 🎉</h1>

      <div id="score"></div>

      <button id="restartBtn">Restart Quiz</button>
    </div>

  </div>
